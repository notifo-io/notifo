version: '3'
services:
  webhookcatcher:
    image: tarampampam/webhook-tester
    command: serve --port 1026
    ports:
      - "1026:1026"
    networks:
      - internal

  mailcatcher:
    image: jeanberu/mailcatcher:0.8.0
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - internal

networks:
  internal:
    driver: bridge